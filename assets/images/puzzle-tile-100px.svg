<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="mainSurface" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FDF6E3"/>
          <stop offset="50%" stop-color="#F5F0DC"/>
          <stop offset="100%" stop-color="#EDE4D3"/>
        </linearGradient>
        
        <linearGradient id="topBevel" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFEF7" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#FFFEF7" stop-opacity="0"/>
        </linearGradient>
        
        <linearGradient id="leftBevel" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FFFEF7" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#FFFEF7" stop-opacity="0"/>
        </linearGradient>
        
        <linearGradient id="bottomBevel" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#D4C4A8" stop-opacity="0"/>
          <stop offset="100%" stop-color="#D4C4A8" stop-opacity="0.6"/>
        </linearGradient>
        
        <linearGradient id="rightBevel" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#D4C4A8" stop-opacity="0"/>
          <stop offset="100%" stop-color="#D4C4A8" stop-opacity="0.5"/>
        </linearGradient>
        
        <radialGradient id="innerGlow" cx="50%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#FFFEF7" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#FFFEF7" stop-opacity="0"/>
        </radialGradient>
        
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#C0B59C" flood-opacity="0.3"/>
        </filter>
      </defs>
      
      <rect x="2" y="2" width="96" height="96" fill="url(#mainSurface)" filter="url(#dropShadow)"/>
      <rect x="2" y="2" width="96" height="96" fill="url(#innerGlow)"/>
      <rect x="2" y="2" width="96" height="8" fill="url(#topBevel)"/>
      <rect x="2" y="2" width="8" height="96" fill="url(#leftBevel)"/>
      <rect x="2" y="90" width="96" height="8" fill="url(#bottomBevel)"/>
      <rect x="90" y="2" width="8" height="96" fill="url(#rightBevel)"/>
      <rect x="2" y="2" width="6" height="6" fill="#FFFEF7" opacity="0.6"/>
      <g opacity="0.1">
        <line x1="15" y1="20" x2="85" y2="25" stroke="#D4C4A8" stroke-width="0.5"/>
        <line x1="20" y1="45" x2="80" y2="48" stroke="#D4C4A8" stroke-width="0.3"/>
        <line x1="25" y1="70" x2="75" y2="72" stroke="#D4C4A8" stroke-width="0.4"/>
      </g>
    </svg>